name: bounded HYG-PILOT-01 remediation
on:
  push:
    branches: [fix/e0-pilot-arm-reference-binding-20260910]
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/e0-pilot-arm-reference-binding-20260910
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python scripts/e0/_tmp_apply_hyg_pilot_01.py
      - run: python -m pip install --disable-pip-version-check -r requirements-e0.txt
      - run: python scripts/e0/validate_contracts.py
      - run: python -m unittest discover -s tests/e0 -v
      - name: Commit bounded fix
        run: |
          rm .github/workflows/_tmp_hyg_pilot_01.yml scripts/e0/_tmp_apply_hyg_pilot_01.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(e0): bind Pilot arms to approved references"
          git push origin HEAD:fix/e0-pilot-arm-reference-binding-20260910
