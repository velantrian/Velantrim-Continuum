name: One-shot final hygiene helper

on:
  push:
    branches: [chore/final-hygiene-20260911]

permissions:
  contents: write

jobs:
  finalize-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/final-hygiene-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded full-file hygiene edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ledger = Path('docs/ai/AUDIT_AND_FUTURE_WORK.md')
          text = ledger.read_text(encoding='utf-8')
          title = '# 🌎 Velantrim Continuum / IDPS — Audit & Future Work Ledger\n\n'
          assert text.startswith(title), 'unexpected audit ledger header'
          marker = '> **HISTORICAL AUDIT / FUTURE-WORK LEDGER — NOT CURRENT STATE**'
          assert marker not in text, 'historical banner already present'
          banner = (
              '> **HISTORICAL AUDIT / FUTURE-WORK LEDGER — NOT CURRENT STATE**  \n'
              '> The dated checkpoint and queue below are preserved as historical research/audit record.  \n'
              '> For current project state, read `project-state.json`, `STATUS.md`, `docs/ai/CURRENT_STATE.md`, and verify live GitHub lifecycle facts directly.  \n'
              '> Historical queue entries do **not** authorize implementation, Pilot, Evidence Lock, E0-C/E0-T, runtime, architecture, or ecosystem integration.\n\n'
          )
          ledger.write_text(title + banner + text[len(title):], encoding='utf-8')

          test_file = Path('tests/e0/test_pilot_control.py')
          tests = test_file.read_text(encoding='utf-8')
          assert tests.count('shlex') == 1, 'shlex is not a single import-only reference'
          assert 'import shlex\n' in tests, 'expected shlex import missing'
          test_file.write_text(tests.replace('import shlex\n', '', 1), encoding='utf-8')
          PY

      - name: Remove helper and validate exact diff scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-final-hygiene-helper.yml
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/one-shot-final-hygiene-helper.yml'
            'docs/ai/AUDIT_AND_FUTURE_WORK.md'
            'tests/e0/test_pilot_control.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "$(printf '%s\n' "${changed[@]}")" == "$(printf '%s\n' "${expected_sorted[@]}")" ]]
          python -m py_compile scripts/e0/execute_pilot.py tests/e0/test_pilot_control.py

      - name: Commit finalized hygiene edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai/AUDIT_AND_FUTURE_WORK.md tests/e0/test_pilot_control.py .github/workflows/one-shot-final-hygiene-helper.yml
          git commit -m 'chore: finish bounded hygiene cleanup'
          git push origin HEAD:chore/final-hygiene-20260911
