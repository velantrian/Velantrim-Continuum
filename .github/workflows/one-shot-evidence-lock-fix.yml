name: One-shot Evidence Lock fail-closed repair

on:
  push:
    branches:
      - fix/e0-evidence-lock-schema-fail-closed-20260909

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'chore: repair one-shot Evidence Lock workflow'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          check-latest: false

      - name: Apply bounded patch
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python -

      - name: Install Experiment 0 validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-e0.txt

      - name: Verify bounded repair
        run: |
          python -m compileall -q scripts/e0 tests/e0
          python scripts/e0/validate_contracts.py
          python -m unittest discover -s tests/e0 -v
          python scripts/run_all_tests.py
          git diff --check

      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/e0/e0_core.py scripts/e0/check_evidence_lock.py tests/e0/test_evidence_lock_paths.py
          git commit -m "fix(e0): fail closed on malformed Evidence Lock"
          git push origin HEAD:fix/e0-evidence-lock-schema-fail-closed-20260909
