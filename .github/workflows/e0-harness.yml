name: Experiment 0 harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e0-harness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          check-latest: false

      - name: Install Experiment 0 validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-e0.txt
      - name: Compile Experiment 0 scripts
        run: python -m compileall -q scripts/e0
      - name: Validate Experiment 0 contracts
        run: python scripts/e0/validate_contracts.py
      - name: Run Experiment 0 unit tests
        run: python -m unittest discover -s tests/e0 -v
