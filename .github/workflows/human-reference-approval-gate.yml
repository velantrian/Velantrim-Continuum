name: Human reference approval binding gate

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/e0/gold/approved/**"
      - "experiments/e0/oracle/approved/**"
      - "experiments/e0/approval/**"
      - "scripts/e0/validate_human_reference_approval.py"
      - "scripts/e0/review_snapshot.py"
      - "scripts/e0/e0_core.py"
      - "scripts/e0/validate_contracts.py"
      - "experiments/e0/schema/**"
      - "tests/e0/**"
      - ".github/workflows/human-reference-approval-gate.yml"
      - ".github/workflows/e0-harness.yml"

# Human approval is now closed and authoritative. This gate therefore acts as a
# permanent post-approval invariant: changes to approved references, approval
# records, validation logic, schemas, tests, or the workflows that enforce those
# bindings must continue to validate the exact reviewed commit/tree bytes and
# current approved bindings. Candidate research artifacts remain outside this
# gate unless and until they are promoted into an approved authority surface.
permissions:
  contents: read

concurrency:
  group: human-reference-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-human-reference-approval-bindings:
    name: Verify Gold/Oracle approval attestation bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull request head with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          check-latest: false

      - name: Install Experiment 0 validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-e0.txt

      - name: Validate approval against reviewed commit tree and exact SHA-256 bindings
        run: |
          python scripts/e0/validate_human_reference_approval.py \
            --repo-root . \
            --approval experiments/e0/approval/human-reference-approval.v0.2.json \
            --issue-number 9

      - name: Re-run offline Experiment 0 contracts and guard tests
        run: |
          python scripts/e0/validate_contracts.py
          python -m unittest discover -s tests/e0 -v
